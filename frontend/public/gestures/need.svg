<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#111827"/>
    </marker>
  </defs>

  <!-- Clean White Textbook Paper Background -->
  <rect width="360" height="320" fill="#FFFFFF"/>
  <rect x="10" y="10" width="340" height="300" rx="10" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>

  <!-- Top Reference Header -->
  <text x="24" y="32" font-family="'Times New Roman', Georgia, serif" font-size="12" font-weight="bold" fill="#374151" letter-spacing="1">
    FIG. 03 — ISL: NEED (DOWNWARD HOOK TAP)
  </text>
  <line x1="24" y1="38" x2="336" y2="38" stroke="#E5E7EB" stroke-width="1"/>

  <!-- ================= DOTTED END POSITION (DOWNWARD TAPPED STROKE) ================= -->
  <g stroke="#9CA3AF" stroke-width="1.8" stroke-dasharray="4 4" fill="#F9FAFB" fill-opacity="0.5">
    <!-- Dotted wrist & hand lower -->
    <path d="M 125 240 L 155 195 L 205 195 L 180 240 Z"/>
    <!-- Dotted bent hook lower -->
    <path d="M 205 195 C 220 195 235 205 235 220 C 235 235 220 245 205 245"/>
    <path d="M 195 210 C 205 210 215 215 215 225 C 215 235 205 240 195 240"/>
  </g>

  <!-- ================= INSTRUCTIONAL DOWNWARD MOVEMENT ARROWS ================= -->
  <!-- Primary Downward Tap Arrow -->
  <path d="M 230 145 L 230 205" fill="none" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- Secondary Accent Arrow -->
  <path d="M 250 155 L 250 195" fill="none" stroke="#4B5563" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <!-- Tap Impact Marks at bottom -->
  <path d="M 215 255 L 225 262" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
  <path d="M 230 258 L 230 268" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
  <path d="M 245 255 L 235 262" stroke="#111827" stroke-width="2" stroke-linecap="round"/>

  <!-- ================= PRIMARY HAND (BLACK INK TEXTBOOK ART) ================= -->
  <!-- Forearm entering from lower left -->
  <path d="M 85 245 L 135 155 L 160 162 L 105 255 Z" fill="#FFFFFF" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>
  <!-- Wrist crease -->
  <path d="M 125 170 C 135 175 145 180 152 178" fill="none" stroke="#6B7280" stroke-width="1.5"/>

  <!-- Main Hand Body (Tilted Forward / Lateral View) -->
  <path d="M 135 155 C 130 140 135 125 148 115 C 165 105 190 108 205 120 C 212 128 215 142 208 155 L 160 162 Z"
        fill="#FFFFFF" stroke="#111827" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Thumb (Folded gently across palm side) -->
  <path d="M 148 135 C 158 132 175 136 182 144 C 185 150 178 156 168 156 C 158 156 150 148 148 135 Z"
        fill="#FFFFFF" stroke="#111827" stroke-width="2"/>
  <path d="M 165 142 C 172 144 176 148 178 152" fill="none" stroke="#6B7280" stroke-width="1.2"/>

  <!-- Index Finger: Distinctly BENT / HOOKED downward (Primary ISL Need Shape) -->
  <!-- Proximal Phalanx extends forward from knuckle -->
  <path d="M 205 120 C 220 120 236 128 238 140 C 240 155 228 168 215 170 C 205 170 200 160 202 152 C 204 145 212 142 220 144 C 224 140 220 135 210 132 L 200 130"
        fill="#FFFFFF" stroke="#111827" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Knuckle crease and bend creases -->
  <line x1="220" y1="124" x2="224" y2="132" stroke="#6B7280" stroke-width="1.4"/>
  <line x1="234" y1="138" x2="228" y2="145" stroke="#6B7280" stroke-width="1.4"/>

  <!-- Middle Finger: Partially curled alongside or supporting hook -->
  <path d="M 195 135 C 208 135 218 142 218 150 C 218 160 208 166 198 165"
        fill="#FFFFFF" stroke="#111827" stroke-width="2"/>
  <path d="M 206 142 C 212 145 212 152 208 156" fill="none" stroke="#6B7280" stroke-width="1.2"/>

  <!-- Ring Finger: Curled inward -->
  <path d="M 182 145 C 192 146 198 154 196 160 C 194 166 186 168 180 165"
        fill="#FFFFFF" stroke="#111827" stroke-width="1.8"/>

  <!-- Pinky Finger: Curled against palm -->
  <path d="M 170 152 C 178 154 184 160 182 165 C 180 170 174 170 168 166"
        fill="#FFFFFF" stroke="#111827" stroke-width="1.8"/>

  <!-- Descriptive Technical Annotations (Textbook style) -->
  <g font-family="'Courier New', Courier, monospace" font-size="10" fill="#374151">
    <text x="24" y="278">1. RIGHT HAND: BENT INDEX HOOK</text>
    <text x="24" y="294">2. PALM FACING DOWNWARD</text>
    <text x="210" y="294">3. FIRM DOWN-TAP ↓</text>
  </g>
</svg>
